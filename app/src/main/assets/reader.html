<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fdf7eb;
    }
    foliate-view {
        display: block;
        width: 100%;
        height: 100%;
        /* readable default margins */
        --_margin-top: 40px;
        --_margin-right: 40px;
        --_margin-bottom: 40px;
        --_margin-left: 40px;
    }
    body {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
    }
    /* Hide scrollbars but keep scrolling functional */
    ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<script src="reader-engine.js"></script>
<script>
    // Bridge: Android -> JS entry points are exposed on globalThis.readerEngine.
    // Android (Kotlin) calls these via webView.evaluateJavascript(...).
    function ready() {
        try {
            if (window.AndroidBridge && window.AndroidBridge.postMessage) {
                window.AndroidBridge.postMessage(JSON.stringify({ name: 'ready', data: {} }));
            }
        } catch (e) {}
    }
    window.addEventListener('load', ready);
</script>
</body>
</html>
